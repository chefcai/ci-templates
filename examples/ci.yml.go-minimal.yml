# Thin wrapper for a Go repo with no Dockerfile and no web UI.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  baseline:
    permissions:
      contents: read
      pull-requests: write
    uses: chefcai/ci-templates/.github/workflows/baseline.yml@main

  go:
    uses: chefcai/ci-templates/.github/workflows/go.yml@main
    with:
      go-version-file: go.mod
