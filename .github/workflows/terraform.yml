name: Terraform (reusable)

# Terraform-specific pieces only: fmt/validate, plus an optional deeper
# policy layer. Known-vuln/misconfig scanning is NOT duplicated here -
# baseline.yml's Trivy `config` scan already covers Terraform
# misconfiguration (the same scanner that already covers Dockerfile
# checks), so a Terraform repo may need close to nothing beyond baseline.
#
# Written ahead of need (chefcai/ci-templates#5, tracked in #4) - no live
# repo exercises this yet. Revisit once one does.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the root Terraform config."
        type: string
        default: "."
      checkov-blocking:
        description: "Graduate checkov from report-only to blocking."
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deeper policy/SAST layer on top of what baseline.yml's Trivy
      # config scan already covers. Report-only by default like every
      # newly-added scanner (see README '5').
      - name: checkov
        uses: bridgecrewio/checkov-action@v12.3123.0
        with:
          directory: ${{ inputs.working-directory }}
        continue-on-error: ${{ !inputs.checkov-blocking }}
