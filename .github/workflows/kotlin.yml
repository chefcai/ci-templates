name: Kotlin/JVM (reusable)

# Gradle-based Kotlin/Java. Written for chefcai/launcher (chefcai/ci-templates#3),
# which is an Android app - `build-cmd` defaults to a plain `./gradlew
# build` but an Android repo will need to override it (e.g.
# `./gradlew assembleDebug`) and needs the Android SDK on the runner,
# which is why `setup-android` is conditional rather than assumed.
#
# detekt covers both lint and SAST here (no separate SAST tool) - it has
# its own rule categories for both, so this doesn't need a second tool the
# way Go needed gosec alongside go vet. Known-vuln scanning relies on
# Trivy fs in baseline.yml reading the Gradle lockfile - Android projects
# often don't commit one by default, so that only works once
# `./gradlew dependencies --write-locks` output is checked in; until then
# there's effectively no known-vuln coverage for this repo shape, which is
# worth flagging rather than silently assuming Trivy already handles it.
#
# Validated against chefcai/launcher: that repo has no detekt Gradle
# plugin applied, so `./gradlew detekt` fails with "task not found" rather
# than reporting findings. Rather than assume every onboarded Kotlin repo
# has detekt configured, the security job now detects whether the task
# exists first and skips cleanly (same pattern as iac.yml's
# terraform/cfn-lint auto-detection) - add the detekt Gradle plugin to a
# repo to get real coverage from this job.
#
# ci-templates#10: for is-android repos, `build-cmd` (e.g. `assembleDebug`)
# already produces a sideloadable debug APK on every push/PR - it just sat
# on the runner unused. Uploading it as a plain workflow artifact means a
# PR branch can be sideloaded straight from its own CI run, with no tag, no
# GitHub Release, no version bump - release.yml stays the only path that
# actually publishes something.

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      is-android:
        description: "Whether to install the Android SDK before building (needed for an Android app; skip for a plain JVM/Kotlin library)."
        type: boolean
        default: false
      build-cmd:
        description: "Command that builds the project, e.g. `./gradlew build` or `./gradlew assembleDebug`."
        type: string
        default: "./gradlew build"
      test-cmd:
        description: "Command that runs the test suite."
        type: string
        default: "./gradlew test"
      detekt-blocking:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - if: ${{ inputs.is-android }}
        uses: android-actions/setup-android@v4
      - run: ${{ inputs.test-cmd }}
      - run: ${{ inputs.build-cmd }}
      - name: Upload debug APK
        if: ${{ inputs.is-android }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Detect detekt task
        id: detect
        run: |
          if ./gradlew tasks --all --console=plain | grep -qE '^detekt( |$)'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No 'detekt' Gradle task found - skipping. Add the detekt Gradle plugin to this repo to get real coverage from this job."
          fi
      - name: detekt
        if: steps.detect.outputs.found == 'true'
        run: ./gradlew detekt
        continue-on-error: ${{ !inputs.detekt-blocking }}
