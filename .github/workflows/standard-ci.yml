name: Standard CI (reusable)

# Reusable test / security / (optional) a11y / (optional) docker pipeline.
# Called from a consuming repo's thin `.github/workflows/ci.yml` via
# `workflow_call`. See README.md for the full input reference, the
# report-only -> blocking graduation policy, and how to add a new language.
#
# Source of truth this was extracted from: chefcai/anya-qr's original
# inline ci.yml. Every "known gotcha" documented there is encoded here as
# actual configuration, not just a comment, so an action version bump can't
# silently regress it:
#   - govulncheck is installed and run manually (never golang/govulncheck-action)
#   - gitleaks job carries `pull-requests: write`
#   - Trivy fs/config scan always sets `scanners: vuln,config` explicitly
#   - the govulncheck step pins GOTOOLCHAIN=auto itself, independent of
#     whatever default actions/setup-go ships next
#   - docker images are built+scanned per platform, then pushed combined

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language of the repo. Only 'go' is implemented today - see README '6. Adding a new language'."
        type: string
        required: true
      go-version-file:
        description: "Path to go.mod used to pin the Go toolchain (language: go only)."
        type: string
        default: "go.mod"
      build-cmd:
        description: "Optional extra build-verification command run in the test job. Leave empty to skip - most repos already get build coverage from the security/a11y/docker jobs."
        type: string
        default: ""
      has-dockerfile:
        description: "Whether this repo ships a container. Enables the docker jobs and the Trivy image scan."
        type: boolean
        default: false
      image-name:
        description: "Fully-qualified image name to build/push. Defaults to ghcr.io/<owner>/<repo>."
        type: string
        default: ""
      platforms:
        description: "Comma-separated docker platforms to build, scan (each separately), and push (combined)."
        type: string
        default: "linux/amd64,linux/arm64"
      a11y:
        description: "Manual opt-in: run the pa11y/Puppeteer accessibility job. Only meaningful for web-facing repos - see README '3. a11y'."
        type: boolean
        default: false
      a11y-build-cmd:
        description: "Command that builds the server/app under test for the a11y job."
        type: string
        default: ""
      a11y-start-cmd:
        description: "Command that starts the built app in the background. Must return immediately (end it with `&`)."
        type: string
        default: ""
      a11y-healthcheck-url:
        description: "URL the a11y job polls until it returns 2xx before scanning."
        type: string
        default: ""
      a11y-seed-cmd:
        description: "Optional command to seed data into the running app before scanning."
        type: string
        default: ""
      a11y-install-cmd:
        description: "Command that installs the pa11y/Puppeteer scanner's own dependencies."
        type: string
        default: "npm ci --prefix tools/a11y"
      a11y-scan-cmd:
        description: "Command that runs the light+dark pa11y scan (see README for the page.emulateMediaFeatures() pattern)."
        type: string
        default: "node tools/a11y/scan.js"
      a11y-base-url-env:
        description: "Env var name the scan command reads the running app's base URL from."
        type: string
        default: "A11Y_BASE_URL"
      a11y-base-url:
        description: "Value to export under a11y-base-url-env before running the scan command."
        type: string
        default: ""
      trivy-skip-dirs:
        description: "Comma-separated paths excluded from the Trivy filesystem/config scan. Use only for documented, accepted-risk exceptions (see README '5. Accepting a finding')."
        type: string
        default: ""
      gosec-blocking:
        description: "Graduate gosec from report-only to blocking."
        type: boolean
        default: false
      gitleaks-blocking:
        description: "Graduate gitleaks from report-only to blocking."
        type: boolean
        default: false
      trivy-fs-blocking:
        description: "Graduate the Trivy filesystem/config scan from report-only to blocking."
        type: boolean
        default: false
      trivy-image-blocking:
        description: "Graduate the Trivy image scan from report-only to blocking."
        type: boolean
        default: false
      a11y-blocking:
        description: "Graduate the a11y scan from report-only to blocking."
        type: boolean
        default: false

jobs:
  unsupported-language:
    if: ${{ inputs.language != 'go' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::language '${{ inputs.language }}' is not implemented yet in chefcai/ci-templates - only 'go' is proven so far. See README.md section 6 'Adding a new language' before onboarding a non-Go repo."
          exit 1

  test:
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build verification
        if: ${{ inputs.build-cmd != '' }}
        run: ${{ inputs.build-cmd }}

  security:
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the API - without this it gets
      # a silent 403 that looks like a clean pass under continue-on-error.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      # Call-graph-aware known-vulnerability scan of stdlib + deps.
      # Deliberately NOT golang/govulncheck-action: its internal setup-go
      # step silently overrides the go-version-file pin above and can mask
      # real findings. Installed and run manually so it reuses the
      # toolchain actions/setup-go just pinned.
      - name: govulncheck
        env:
          # actions/setup-go@v7 sets GOTOOLCHAIN=local, which blocks Go's
          # normal auto-download of a newer toolchain. govulncheck's own
          # go.mod can require a newer Go than the repo is pinned to. Pin
          # this explicitly rather than trusting setup-go's current
          # default, so a future setup-go major bump can't silently break
          # this step the way v5->v7 did.
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        # Always blocking - do not add continue-on-error here.

      - name: gosec
        uses: securego/gosec@v2.29.0
        with:
          args: ./...
        continue-on-error: ${{ !inputs.gosec-blocking }}

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ !inputs.gitleaks-blocking }}

      - name: Trivy filesystem & config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Must be explicit - the fs default is vuln-only and silently
          # skips Dockerfile/IaC misconfiguration checks otherwise.
          scanners: vuln,config
          severity: CRITICAL,HIGH
          exit-code: ${{ inputs.trivy-fs-blocking && '1' || '0' }}
          skip-dirs: ${{ inputs.trivy-skip-dirs }}

  a11y:
    if: ${{ inputs.a11y }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up language toolchain
        if: ${{ inputs.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Build app under test
        if: ${{ inputs.a11y-build-cmd != '' }}
        run: ${{ inputs.a11y-build-cmd }}
      - name: Start app under test
        run: ${{ inputs.a11y-start-cmd }}
      - name: Wait for health check
        if: ${{ inputs.a11y-healthcheck-url != '' }}
        run: |
          for i in $(seq 1 20); do curl -sf "${{ inputs.a11y-healthcheck-url }}" && break; sleep 0.5; done
      - name: Seed test data
        if: ${{ inputs.a11y-seed-cmd != '' }}
        run: ${{ inputs.a11y-seed-cmd }}
      - name: Install a11y scanner deps
        run: ${{ inputs.a11y-install-cmd }}
      # Scans both light and dark rendering. The scan command is expected
      # to toggle prefers-color-scheme itself via Puppeteer's
      # page.emulateMediaFeatures() rather than running as two separate
      # tool invocations - see README '3. a11y'.
      - name: Run a11y scan (light + dark)
        env:
          A11Y_SCAN_BASE_URL_PLACEHOLDER: "unused"
        run: |
          export "${{ inputs.a11y-base-url-env }}=${{ inputs.a11y-base-url }}"
          ${{ inputs.a11y-scan-cmd }}
        continue-on-error: ${{ !inputs.a11y-blocking }}

  docker-setup:
    if: ${{ inputs.has-dockerfile }}
    needs: [test, security]
    runs-on: ubuntu-latest
    outputs:
      platforms-json: ${{ steps.split.outputs.json }}
      image: ${{ steps.image.outputs.value }}
    steps:
      - id: split
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: echo "json=$(jq -Rc 'split(",")' <<< "$PLATFORMS")" >> "$GITHUB_OUTPUT"
      - id: image
        run: |
          if [ -n "${{ inputs.image-name }}" ]; then
            echo "value=${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

  docker-scan:
    if: ${{ inputs.has-dockerfile }}
    needs: [docker-setup]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.docker-setup.outputs.platforms-json) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.docker-setup.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      # buildx --load cannot load a multi-platform manifest as one local
      # image, so each target platform is built and scanned separately;
      # docker-push below does one final combined-platform push build.
      - name: Build image for ${{ matrix.platform }} (local only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}
      - name: Trivy image scan (${{ matrix.platform }}, before push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          exit-code: ${{ inputs.trivy-image-blocking && '1' || '0' }}

  docker-push:
    if: ${{ inputs.has-dockerfile && github.event_name != 'pull_request' }}
    needs: [docker-setup, docker-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.docker-setup.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - name: Push combined multi-platform image (never push unscanned - docker-scan already gated this)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
      - name: Report image size
        run: |
          IMAGE="${{ needs.docker-setup.outputs.image }}"
          IMAGE="${IMAGE,,}"
          docker pull "$IMAGE:sha-$(git rev-parse --short HEAD)" >/dev/null
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}'
